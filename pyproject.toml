[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mltemplate"
version = "0.1.0"
description = "Reusable PyTorch training template: config, tracking, AMP, DDP, checkpointing, tests, Docker, CI."
license = { text = "MIT" }
authors = [{ name = "Ariska Adi Prasetyo" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "hydra-core>=1.3",
    "numpy>=1.26",
]

[project.optional-dependencies]
tracking = ["wandb>=0.17"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3.7", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/mltemplate"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # lets tests import scripts/ and app/
markers = ["slow: multi-process tests (deselect with -m 'not slow')"]
